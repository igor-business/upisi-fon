<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defaults for the landing page; every page updates title, description and canonical (usePageMeta). -->
    <title>UpišiFON – online priprema za prijemni iz matematike na FON-u</title>
    <meta
      name="description"
      content="Online priprema za prijemni iz matematike na FON-u: video lekcije, zadaci sa rešenjima, probni prijemni ispiti i mentor. Priprema edukativnog centra Binary Bioskop."
    />
    <link rel="canonical" href="https://upisifon.rs/" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Viber, WhatsApp, Instagram, Facebook, LinkedIn, X). These apps do not run
         JavaScript, so the preview is always this one. Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UpišiFON" />
    <meta property="og:locale" content="sr_RS" />
    <meta property="og:url" content="https://upisifon.rs/" />
    <meta property="og:title" content="UpišiFON – tvoj put do FON-a počinje ovde" />
    <meta
      property="og:description"
      content="Kompletna online priprema za prijemni iz matematike, od prve lekcije do probnog ispita, uz mentora koji te prati korak po korak."
    />
    <meta property="og:image" content="https://upisifon.rs/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="UpišiFON – maskota sova uči matematiku za laptopom" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
